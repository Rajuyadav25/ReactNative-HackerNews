# Release Pipeline V1
# PR Verification Workflow Template
#
# Instantiate repository-specific values and optional blocks from
# build-requirements.md before installing this workflow.
#
# Do not guess package managers, commands, checks, or cache behavior.
# Remove checks that inspection establishes are not applicable.

name: PR Checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'

      - name: Set up Yarn classic
        run: npm install --global yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Lint (also enforces Prettier via @react-native-community/eslint-config)
        run: yarn lint

      - name: Type check
        run: yarn tsc --noEmit

      # Formatting: enforced by the Lint step (prettier/prettier is an ESLint error in this repository); no separate format command exists (build-requirements.md §5).

      # --forceExit: the upstream App test completes and passes, but the rendered app keeps react-query timers and live network
      # requests open so Jest never exits (PIPELINE_ADAPTATION; proof-evidence/master-mission/E-gate2).
      - name: Test
        run: yarn test --ci --forceExit
