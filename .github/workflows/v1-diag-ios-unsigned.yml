# Release Pipeline V1 — DIAGNOSTIC workflow (not the V1 pipeline; no signing,
# no secrets). Purpose: unsigned iOS Release on GitHub-hosted Xcode 26.6 with
# the packaged lock portability guard enforced at the runner checkout path.
name: v1-diag-ios-unsigned
on:
  push:
    branches: ["v1-diag/ios-unsigned-ci"]
permissions:
  contents: read
jobs:
  ios-unsigned:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: |
          echo "EVIDENCE=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"; mkdir -p "$RUNNER_TEMP/evidence"
          sudo xcode-select -s /Applications/Xcode_26.6.0.app/Contents/Developer
          { echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"; echo "head=$(git rev-parse HEAD) tree=$(git rev-parse 'HEAD^{tree}')"; xcodebuild -version; xcrun swift --version; } 2>&1 | tee "$RUNNER_TEMP/evidence/toolchain.txt"
      - uses: actions/setup-node@v4
        with: { node-version: '16.20.2' }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.4.5', bundler-cache: false }
      - name: Install dependencies
        env: { CURRENT_ARCH: arm64 }
        run: |
          set -euo pipefail
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile --non-interactive
          gem install --no-document cocoapods -v 1.11.3
          gem install --no-document bigdecimal logger benchmark mutex_m base64 drb
          pod --version
          pod install --project-directory=ios 2>&1 | tee "$EVIDENCE/pod-install.txt"
      - name: Lock portability guard
        run: .github/v1/lock-portability-guard.sh .github/v1/ios-podfile-lock.conf "$EVIDENCE/lock-guard"
      - name: Probe Yoga -Wno-error settings on this clang (object identity)
        run: |
          set -euo pipefail
          printf '%s\n' 'struct V { float v; };' 'inline V operator"" _pt(long double x) { return V{static_cast<float>(x)}; }' 'struct L { bool h; bool o() const { return h; } };' 'bool g(L a, L b) { return a.o() | b.o(); }' 'V f() { return 1.0_pt; }' > "$RUNNER_TEMP/probe.cpp"
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          CXX="xcrun --sdk iphonesimulator clang++ -target arm64-apple-ios12.0-simulator -isysroot $SDK -std=c++1y -c $RUNNER_TEMP/probe.cpp"
          { xcrun clang --version | head -1
            echo "## -Wall -Werror"; $CXX -o "$RUNNER_TEMP/a.o" -Wall -Werror 2>&1 | grep -E 'error|warning' || true
            echo "## with -Wno-error flags"; $CXX -o "$RUNNER_TEMP/b.o" -Wno-error=bitwise-instead-of-logical -Wno-error=deprecated-literal-operator -Wall -Werror 2>&1 | grep -E 'error|warning' || true
            $CXX -o "$RUNNER_TEMP/c.o" -Wall 2>/dev/null
            cmp "$RUNNER_TEMP/b.o" "$RUNNER_TEMP/c.o" && echo "objects byte-identical (with flags vs without -Werror)"; } | tee "$EVIDENCE/clang-flag-probe.txt"
      - name: Unsigned iOS Release build (Gate 1A command)
        run: |
          set +e
          xcodebuild -workspace ios/HackerNews.xcworkspace -scheme HackerNews -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -derivedDataPath "$RUNNER_TEMP/derived" build > "$EVIDENCE/xcodebuild.txt" 2>&1
          status=$?; echo "exit=$status" | tee "$EVIDENCE/xcodebuild-status.txt"; tail -5 "$EVIDENCE/xcodebuild.txt"; exit $status
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: v1-diag-ios-unsigned-hackernews, path: "${{ runner.temp }}/evidence", retention-days: 30 }
